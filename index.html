<!DOCTYPE html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>인성디지탈 이벤트 캘린더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--ink:#1f1f1f;--hdr:#3a3a3a;--hdr-text:#ffffff;--line:#d9d9d9;--muted:#6b6b6b;--faint:#8a8a8a;--sub:#f2f2f2;--focus-bg:#f3f3f3;--page:#ffffff;--accent:#1b4f9c;--danger:#9a1b1b;--gate:#1f1f1f;--hover:#eef3fa}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","나눔고딕",NanumGothic,sans-serif;font-size:14.5px;line-height:1.35;padding:28px 40px 60px}
h1{font-size:34px;font-weight:700;margin:0 0 6px;letter-spacing:-0.5px;text-wrap:balance}
.sub{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px;flex-wrap:wrap}
.sub p{margin:0;color:var(--muted);font-size:16px}
.legend{color:var(--ink);font-size:14px;white-space:nowrap;display:flex;gap:14px;align-items:center}
.legend .b{font-weight:700}
.toolbar{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.toolbar .sp{flex:1}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:3px;cursor:pointer}
button:hover{background:var(--sub)}
button.primary{background:var(--hdr);color:#fff;border-color:var(--hdr)}
button.danger{color:var(--danger)}
button:focus-visible,td.cell:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.status{font-size:12.5px;color:var(--faint)}
.wrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:1100px;table-layout:fixed}
col.c0{width:220px}col.cm{width:calc((100% - 220px) / 4)}
th{background:var(--hdr);color:var(--hdr-text);font-weight:700;font-size:15px;padding:14px 12px;text-align:center;border:1px solid #5a5a5a}
th:first-child{text-align:center}
td{border:1px solid var(--line);padding:0 12px;vertical-align:middle;font-size:14.5px;background:#fff;height:74px;overflow:hidden}
td.lbl{font-weight:700;font-size:15px}
td.lbl.vl{cursor:pointer}td.lbl.vl:hover{background:var(--hover)}td.lbl.vl::after{content:" ›";color:var(--faint);font-weight:400}
tr.dark td.lbl{background:var(--hdr);color:#fff}
tr.dark td.cell{background:var(--sub)}
td.cell{cursor:pointer;transition:background .12s}
td.cell:hover{background:var(--hover)}
td.cell .ev{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
td.cell .ev+.ev{margin-top:0}
td.cell .sym{display:inline-block;width:1.1em}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:0 5px;border-radius:2px;margin-right:4px;vertical-align:1px}
td.cell .more{color:var(--faint);font-size:12.5px;line-height:1.3}
.cnt{float:right;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.foot{color:var(--faint);font-size:12.5px;margin:10px 0 14px}
.focus{background:var(--focus-bg);border:1px solid var(--line);padding:12px 16px;font-size:15px;text-align:center}
.focus b{margin-right:8px}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100vw);background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;z-index:10}
.drawer.open{transform:none}
.dh{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h2{margin:0;font-size:20px}
.dh .m{color:var(--muted);font-size:14px;margin-top:2px}
.db{padding:14px 22px 30px;overflow:auto;flex:1}
.item{border:1px solid var(--line);padding:12px 14px;margin-bottom:10px;min-width:0}
.item .t{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:baseline;min-width:0}
.item .t>span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.item .t .sym{width:1.1em;display:inline-block}
.item .meta{display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 12px;margin-top:8px;font-size:13.5px}
.item .meta span{min-width:0;overflow-wrap:anywhere}
.item .meta .k{color:var(--faint);white-space:nowrap}
.item .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:10px;color:var(--muted);margin-left:auto;white-space:nowrap}
.pill.done{background:var(--sub)} .pill.confirmed{border-color:var(--accent);color:var(--accent)} .pill.gate{border-color:var(--ink);color:var(--ink)}
form.ed{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 10px;align-items:center;margin-top:10px;font-size:13.5px}
form.ed label{color:var(--faint);white-space:nowrap}
form.ed input,form.ed select,form.ed textarea{font:inherit;font-size:13.5px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;width:100%}
form.ed textarea{min-height:56px;resize:vertical}
form.ed .row2{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.empty{color:var(--faint);padding:20px 0;text-align:center}
.ro{font-size:12.5px;color:var(--faint);margin-top:6px}
@media (max-width:700px){body{padding:18px 16px 40px}h1{font-size:26px}.sub p{font-size:14px}}
@media print{.toolbar,.drawer,.overlay{display:none!important}body{padding:0}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.gate{position:fixed;inset:0;background:var(--page);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.gate[hidden]{display:none}
.gate form{width:min(400px,100%);border:1px solid var(--line);padding:26px 28px;display:grid;gap:8px}
.gate h2{margin:0 0 4px;font-size:20px}.gate p{margin:0 0 8px;color:var(--muted);font-size:14px}
.gate label{font-size:13px;color:var(--faint)}.gate input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:3px}
.gate .gerr{color:var(--danger);font-size:13px;min-height:1.2em}.gate button{margin-top:6px;padding:9px}
body.locked>*:not(.gate){display:none}
.who{font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline dotted}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<div id="gate" class="gate"><form autocomplete="off"><h2>인성디지탈 이벤트 캘린더</h2><p>팀 공통 비밀번호와 이름을 입력하세요. 이 브라우저에 기억됩니다.</p><label for="gKey">비밀번호</label><input id="gKey" type="password" required><label for="gUser">이름 · 직급 (변경 기록에 남습니다)</label><input id="gUser" placeholder="예: 홍길동 과장" required><div id="gErr" class="gerr" role="alert"></div><button class="primary" type="submit">들어가기</button></form></div>
<h1>인성디지탈 이벤트 캘린더 — 2026년 9~12월</h1>
<div class="sub"><p>인성디지탈 전략마케팅 · 벤더별 QBR · 프로모션 · EBC · Demo Room · 세미나를 월별 실행 계획으로 통합 관리 · 칸을 클릭해 이벤트 추가·수정, 벤더 이름을 클릭해 담당자·전략 수정 · 저장하면 모두에게 바로 반영</p>
<div class="legend"><span><span class="tag">P</span>프로모션</span><span><span class="b">●</span> Confirmed</span><span><span class="b">○</span> Planned</span><span><span class="b">◆</span> Decision Gate</span></div></div>
<div class="toolbar"><span class="status" id="st">연결 중…</span><span class="who" id="who" title="이름 바꾸기"></span><span class="sp"></span><button id="btnCsv" hidden>엑셀용 CSV 저장</button><button id="btnLog">변경 이력</button><button id="btnPrint">인쇄</button></div>
<div class="wrap"><table id="grid" aria-label="벤더 월별 이벤트"><colgroup><col class="c0"><col class="cm"><col class="cm"><col class="cm"><col class="cm"></colgroup><thead><tr><th>Vendor / Activity</th><th>9월</th><th>10월</th><th>11월</th><th>12월</th></tr></thead><tbody></tbody></table></div>
<div class="foot"></div>
<div class="focus"><b>Focus</b> —</div>
<div class="overlay" id="ov"></div>
<aside class="drawer" id="dr" aria-label="상세 진행 상황"><div class="dh"><div><h2 id="dTitle">—</h2><div class="m" id="dSub"></div></div><button id="dClose" aria-label="닫기">닫기</button></div><div class="db" id="dBody"></div></aside>
<script>
const ROWS=[];
const DARK=new Set();
const MONTHS=[9,10,11,12];
const SYM={done:"●",confirmed:"●",planned:"○",gate:"◆"};
const SLABEL={done:"완료",confirmed:"확정",planned:"계획",gate:"결정 시점"};
const FALLBACK=[];
const VSLUG={"CrowdStrike": "crowdstrike", "Okta": "okta", "Menlo Security": "menlo", "ExtraHop": "extrahop", "Claroty": "claroty", "SonicWall": "sonicwall", "Fortra": "fortra", "Sonatype": "sonatype", "Check Point": "checkpoint", "Gigamon": "gigamon"};
const VFALL={};
let vendors=JSON.parse(JSON.stringify(VFALL)); let vcol=null;
const SFIELDS=[["grade","등급"],["target","하반기 목표 (백만원)"],["budget","자체 예산 (백만원)"],["set_role","세트 역할"],["direction","전략 방향"],["actions","핵심 활동 3개"],["risk","리스크"]];
const VFIELDS=[["head","지사장"],["channel","채널 담당"],["vmkt","벤더 마케팅"],["am","벤더 AM · 영업"],["email","벤더 이메일 · 연락처"],["sales","인성 영업 담당"],["mkt","인성 마케팅 담당"],["fy","회계연도"],["note","비고"]];
let events=FALLBACK.map(e=>({...e})); let db=null, col=null, canWrite=false, downloads=null, cur=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtD=(d,e)=>{if(!d)return"";const f=x=>{const [y,m,dd]=x.split("-");return `${+m}/${+dd}`};return e&&e!==d?`${f(d)}~${f(e)}`:f(d)};
function byCell(v,m){return events.filter(e=>e.vendor===v&&+e.month===m).sort((a,b)=>(a.date||"9")<(b.date||"9")?-1:(a.date||"9")>(b.date||"9")?1:(a.order||0)-(b.order||0))}
function render(){const tb=$("#grid tbody");tb.innerHTML="";for(const v of ROWS){const tr=document.createElement("tr");if(DARK.has(v))tr.className="dark";tr.innerHTML=`<td class="lbl${VSLUG[v]?" vl":""}" ${VSLUG[v]?`tabindex="0" data-vendor="${esc(v)}"`:""}>${esc(v)}</td>`+MONTHS.map(m=>{const list=byCell(v,m);const show=list.slice(0,2);return `<td class="cell" tabindex="0" data-v="${esc(v)}" data-m="${m}">${show.map(e=>`<span class="ev"><span class="sym">${SYM[e.status]||"○"}</span>${e.type==="promotion"?`<span class="tag">P</span>`:""}${e.date?`${fmtD(e.date,e.end)} `:""}${esc(e.title)}</span>`).join("")}${list.length>2?`<span class="ev more">+${list.length-2}건 더 보기 ›</span>`:""}${list.length===0?`<span class="more">—</span>`:""}</td>`}).join("");tb.appendChild(tr)}
 if(cur)(cur.vendor?renderVendor():renderDrawer())}
function openVendor(v){cur={vendor:v};$("#dTitle").textContent=v;$("#dSub").textContent="벤더 담당자 정보";$("#dr").classList.add("open");$("#ov").classList.add("open");renderVendor();$("#dClose").focus()}
function renderVendor(){const v=cur.vendor;const s=VSLUG[v];const d=vendors[s]||{vendor:v};const b=$("#dBody");
 const sec=(title,fields,act)=>`<div class="item"><div class="t"><span>${title}</span></div><div class="meta">${fields.map(([k,l])=>`<span class="k">${l}</span><span>${esc(d[k]||"—")}</span>`).join("")}</div><div class="acts">${canWrite?`<button data-act="${act}">수정</button>`:""}</div></div>`;
 b.innerHTML=sec("담당자",VFIELDS,"vedit")+sec("하반기 전략 방향",SFIELDS,"sedit")+(canWrite?"":`<div class="ro">${db?"편집 권한이 없어 보기만 가능합니다.":"공유 저장소에 연결되지 않아 보기 전용입니다."}</div>`)}
function vformHtml(d,F=VFIELDS){return `<form class="ed" data-vform="1">${F.map(([k,l])=>`<label>${l}</label>${["note","direction","actions","risk"].includes(k)?`<textarea name="${k}" id="v_${k}">${esc(d[k]||"")}</textarea>`:`<input name="${k}" id="v_${k}" value="${esc(d[k]||"")}">`}`).join("")}<div class="row2"><button type="button" data-act="vcancel">취소</button><button type="submit" class="primary">저장</button></div></form>`}
function openCell(v,m){cur={v,m};$("#dTitle").textContent=v;$("#dSub").textContent=`${m}월 · 상세 진행 상황`;$("#dr").classList.add("open");$("#ov").classList.add("open");renderDrawer();$("#dClose").focus()}
function closeDrawer(){cur=null;$("#dr").classList.remove("open");$("#ov").classList.remove("open")}
function renderDrawer(){const {v,m}=cur;const list=byCell(v,m);const b=$("#dBody");b.innerHTML="";
 if(!list.length)b.innerHTML=`<div class="empty">등록된 이벤트가 없습니다.</div>`;
 for(const e of list){const d=document.createElement("div");d.className="item";d.dataset.id=e.id;d.innerHTML=`<div class="t"><span class="sym">${SYM[e.status]||"○"}</span><span>${e.type==="promotion"?`<span class="tag">프로모션</span>`:""}${esc(e.title)}</span><span class="pill ${e.status}">${SLABEL[e.status]||e.status}</span></div>
 <div class="meta">${(e.type==="promotion"?[["기간",fmtD(e.date,e.end)],["대상",e.audience],["조건",e.condition],["보상",e.reward],["재원",e.funding],["목표 DR",e.target_dr],["결과 DR",e.result_dr],["마케팅",e.owner],["사업부",e.biz],["진행",e.progress],["비고",e.note]]:[["일정",fmtD(e.date,e.end)],["장소",e.place],["마케팅",e.owner],["사업부",e.biz],["목표",e.goal],["예산·MDF",e.budget],["진행",e.progress],["비고",e.note]]).filter(x=>x[1]).map(([k,x])=>`<span class="k">${k}</span><span>${esc(x)}</span>`).join("")}</div>
 <div class="acts">${canWrite?`<button data-act="edit">수정</button><button data-act="del" class="danger">삭제</button>`:""}</div>`;b.appendChild(d)}
 if(canWrite){const add=document.createElement("div");add.className="item";add.innerHTML=`<button data-act="new" class="primary">+ 이벤트 추가</button>`;b.appendChild(add)}
 else b.insertAdjacentHTML("beforeend",`<div class="ro">${db?"편집 권한이 없어 보기만 가능합니다.":"공유 저장소에 연결되지 않아 보기 전용입니다. 편집은 claude.ai에 로그인한 조직 구성원만 가능합니다."}</div>`)}
function formHtml(e){const s=e.status||"planned";const opt=Object.keys(SLABEL).map(k=>`<option value="${k}" ${k===s?"selected":""}>${SYM[k]} ${SLABEL[k]}</option>`).join("");
 const ty=e.type||"event";return `<form class="ed"><label>유형</label><select name="type" id="f_type_${e.id||"new"}"><option value="event" ${ty==="event"?"selected":""}>이벤트 · 활동</option><option value="promotion" ${ty==="promotion"?"selected":""}>프로모션</option></select><label>제목</label><input name="title" id="f_title_${e.id||"new"}" value="${esc(e.title||"")}" required><label>상태</label><select name="status" id="f_status_${e.id||"new"}">${opt}</select><label>시작</label><input type="date" name="date" id="f_date_${e.id||"new"}" value="${esc(e.date||"")}"><label>종료</label><input type="date" name="end" id="f_end_${e.id||"new"}" value="${esc(e.end||"")}"><label>장소</label><input name="place" id="f_place_${e.id||"new"}" value="${esc(e.place||"")}"><label>마케팅</label><input name="owner" id="f_owner_${e.id||"new"}" value="${esc(e.owner||"")}"><label>사업부</label><input name="biz" id="f_biz_${e.id||"new"}" value="${esc(e.biz||"")}"><label>목표</label><input name="goal" id="f_goal_${e.id||"new"}" value="${esc(e.goal||"")}"><label>예산·MDF</label><input name="budget" id="f_budget_${e.id||"new"}" value="${esc(e.budget||"")}"><label>진행</label><input name="progress" id="f_progress_${e.id||"new"}" value="${esc(e.progress||"")}"><label>비고</label><textarea name="note" id="f_note_${e.id||"new"}">${esc(e.note||"")}</textarea><label style="grid-column:1/-1;font-weight:700;color:var(--ink);margin-top:6px">프로모션 스킴 (유형이 프로모션일 때)</label><label>대상</label><input name="audience" id="f_aud_${e.id||"new"}" value="${esc(e.audience||"")}"><label>조건</label><textarea name="condition" id="f_cond_${e.id||"new"}">${esc(e.condition||"")}</textarea><label>보상</label><textarea name="reward" id="f_rew_${e.id||"new"}">${esc(e.reward||"")}</textarea><label>재원</label><input name="funding" id="f_fund_${e.id||"new"}" value="${esc(e.funding||"")}"><label>목표 DR</label><input name="target_dr" id="f_tdr_${e.id||"new"}" value="${esc(e.target_dr||"")}"><label>결과 DR</label><input name="result_dr" id="f_rdr_${e.id||"new"}" value="${esc(e.result_dr||"")}"><div class="row2"><button type="button" data-act="cancel">취소</button><button type="submit" class="primary">저장</button></div></form>`}
$("#dBody").addEventListener("click",async ev=>{const btn=ev.target.closest("button[data-act]");if(!btn)return;const act=btn.dataset.act;const item=btn.closest(".item");const id=item?.dataset.id;const e=events.find(x=>x.id===id);
 if(act==="vedit"){item.innerHTML=vformHtml(vendors[VSLUG[cur.vendor]]||{vendor:cur.vendor});return} if(act==="sedit"){item.innerHTML=vformHtml(vendors[VSLUG[cur.vendor]]||{vendor:cur.vendor},SFIELDS);return} if(act==="vcancel"){renderVendor();return}
 if(act==="edit"){item.innerHTML=formHtml(e)} else if(act==="new"){item.innerHTML=formHtml({vendor:cur.v,month:cur.m})} else if(act==="cancel"){renderDrawer()}
 else if(act==="del"){if(!confirm("이 이벤트를 삭제할까요?"))return;try{await col.doc(id).delete();events=events.filter(x=>x.id!==id);render()}catch(err){alert("삭제 실패: "+(err.code||err.message))}}});
$("#dBody").addEventListener("submit",async ev=>{ev.preventDefault();const f=ev.target;
 if(f.dataset.vform){const s=VSLUG[cur.vendor];const body={...(vendors[s]||{}),vendor:cur.vendor};for(const [k,v] of new FormData(f).entries())body[k]=v.trim();try{await vcol.doc(s).set(body);vendors[s]=body;renderVendor()}catch(err){alert("저장 실패: "+(err.code||err.message))}return}const item=f.closest(".item");const id=item.dataset.id;const fd=new FormData(f);const body={vendor:cur.v,month:cur.m};for(const [k,v] of fd.entries())body[k]=v.trim();
 try{ if(id){const old=events.find(x=>x.id===id);body.order=old.order||0;await col.doc(id).set(body);Object.assign(old,body)} else{body.order=Date.now();const ref=col.doc();await ref.set(body);events.push({...body,id:ref.id})} render()}catch(err){alert("저장 실패: "+(err.code||err.message))}});
$("#grid").addEventListener("click",ev=>{const lb=ev.target.closest("td.lbl.vl");if(lb){openVendor(lb.dataset.vendor);return}const td=ev.target.closest("td.cell");if(td)openCell(td.dataset.v,+td.dataset.m)});
